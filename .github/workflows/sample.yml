name: Verify Blast Radius Sample

on:
  push:
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run make sample
        run: make sample
      - name: Inspect per-commit costs and container time
        run: |
          python3 - <<'PY'
          import json, time, subprocess
          from pathlib import Path

          base = Path("sample")
          tests = {t["number"]: t for t in json.loads((base / "tests.json").read_text())["tests"]}
          dur_ms = {n: round(t["seconds"] * 1000) for n, t in tests.items()}
          ans = json.loads((base / "answers.json").read_text())["commits"]

          for line in Path("output.jsonl").read_text().splitlines():
              row = json.loads(line)
              cid = row["commit"]
              workers = row["workers"]
              sel = {n for w in workers for n in w}
              failing = set(ans[cid]["failing"])
              missed = failing - sel
              cost = 0 if not workers else max(sum(dur_ms[n] for n in w) for w in workers) + 2000 * len(workers)
              if missed or sel or failing:
                  print(f"  {cid:5s} ({ans[cid]['kind']:7s}): w={len(workers)} sel={len(sel):4d} fail={len(failing):2d} miss={len(missed)} cost={cost/1000:6.3f}s")
                  if missed:
                      print(f"    MISSED: {[tests[m]['id'] for m in sorted(missed)]}")
          PY
          docker run --rm --platform linux/amd64 --network none --cpus 2 --memory 4096m --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --user 65534:65534 --env HOME=/tmp --volume $(pwd)/sample/commits:/data/commits:ro --volume $(pwd)/sample/tests.json:/data/tests.json:ro --entrypoint python blast-radius-entry -c "import resource, selector; selector.main(); r = resource.getrusage(resource.RUSAGE_SELF); import sys; print(f'CONTAINER_CPU_TIME={r.ru_utime + r.ru_stime:.3f}s', file=sys.stderr)" > /dev/null
